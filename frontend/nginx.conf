# Frontend container: serves the built SPA and proxies /api/* to the backend.
# This makes the image self-contained — the SPA calls /api on its own origin
# (see src/lib/api.ts) and nginx forwards those calls to the api service.
# TLS is terminated by the upstream global Caddy, so this listens on plain :80.

upstream api_backend {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend, stripping the /api prefix. The trailing
    # slash on proxy_pass replaces the matched "/api/" with "/", so the backend
    # receives /contexts, /health, etc. (it serves routes at the root).
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade headers + disabled buffering so SSE/streaming responses flow
        # through immediately rather than being held back by nginx.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA history-mode fallback: unknown paths return index.html so client-side
    # routing (e.g. /contexts, /people/slug) works on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
