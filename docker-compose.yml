services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc
      POSTGRES_DB: mc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/mc-neo4j-pw
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Deploy services (docker compose --profile deploy up -d) ──────────────

  api:
    profiles: ["deploy"]
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mc:mc@postgres:5432/mc
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mc-neo4j-pw}
      SESSION_SECRET: ${SESSION_SECRET}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Mission Control}
      WEBAUTHN_RP_ORIGIN: ${WEBAUTHN_RP_ORIGIN:-http://localhost:5173}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  worker:
    profiles: ["deploy"]
    build: ./backend
    # entrypoint.sh runs the API regardless of args, so override the entrypoint
    # (not command) to start the worker module.
    entrypoint: ["uv", "run", "python", "-m", "app.graph.worker"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mc:mc@postgres:5432/mc
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mc-neo4j-pw}
      SESSION_SECRET: ${SESSION_SECRET:-}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  search-worker:
    profiles: ["deploy"]
    build: ./backend
    entrypoint: ["uv", "run", "python", "-m", "app.search.worker"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mc:mc@postgres:5432/mc
      SESSION_SECRET: ${SESSION_SECRET:-}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["deploy"]
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
  neo4jdata:
